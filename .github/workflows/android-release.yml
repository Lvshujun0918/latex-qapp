name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (example: v1.2.3)"
        required: true
        type: string

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $TAG"
            echo "Expected format: v1.2.3"
            exit 1
          fi

          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute Android build metadata
        id: meta
        shell: bash
        run: |
          VERSION_NAME="${{ steps.tag.outputs.value }}"
          VERSION_NAME="${VERSION_NAME#v}"
          BASE_VERSION="${VERSION_NAME%%[-+]*}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Invalid semver for versionCode calc: $VERSION_NAME"
            exit 1
          fi

          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.tag.outputs.value }}" "${{ github.sha }}"
          git push origin "refs/tags/${{ steps.tag.outputs.value }}" --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore release keystore
        shell: bash
        run: |
          RELEASE_KEYSTORE_B64='${{ secrets.RELEASE_KEYSTORE_B64 }}'
          RELEASE_KEYSTORE_PASSWORD='${{ secrets.RELEASE_KEYSTORE_PASSWORD }}'
          RELEASE_KEY_PASSWORD='${{ secrets.RELEASE_KEY_PASSWORD }}'

          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Missing release signing secrets"
            exit 1
          fi

          mkdir -p frontend/android/keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > frontend/android/keystore/release.jks

          {
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/frontend/android/keystore/release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=lvshujun"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build web assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build release APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            -PVERSION_NAME=${{ steps.meta.outputs.version_name }} \
            -PVERSION_CODE=${{ steps.meta.outputs.version_code }} \
            -PGIT_SHA=${{ steps.meta.outputs.git_sha }} \
            -PBUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Generate changelog
        shell: bash
        run: |
          mkdir -p dist

          CURRENT_TAG="${{ steps.tag.outputs.value }}"
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -vx "$CURRENT_TAG" | head -n 1 || true)
          BUILD_TIME="${{ steps.meta.outputs.build_time }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ -n "$PREV_TAG" ]; then
            LOG_RANGE="$PREV_TAG..$CURRENT_TAG"
            RANGE_TITLE="自从上一版本 $PREV_TAG 以来的更新如下"
          else
            LOG_RANGE="$CURRENT_TAG"
            RANGE_TITLE="初始版本，更新如下"
          fi

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          group_titles=(
            "🚀 新功能"
            "🐛 问题修复"
            "📚 文档更新"
            "⚡️ 性能优化"
            "♻️ 代码重构"
            "💄 代码格式"
            "✅ 测试相关"
            "👷 CI配置"
            "📦️ 构建系统"
            "🔧 其他更新"
          )

          group_files=(
            "$tmp_dir/01"
            "$tmp_dir/02"
            "$tmp_dir/03"
            "$tmp_dir/04"
            "$tmp_dir/05"
            "$tmp_dir/06"
            "$tmp_dir/07"
            "$tmp_dir/08"
            "$tmp_dir/09"
            "$tmp_dir/10"
          )

          for file in "${group_files[@]}"; do
            : > "$file"
          done

          while IFS=$'\x1f' read -r subject abbrev; do
            [ -z "$subject" ] && continue

            if [[ "$subject" =~ ^feat(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[0]}"
            elif [[ "$subject" =~ ^fix(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[1]}"
            elif [[ "$subject" =~ ^docs(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[2]}"
            elif [[ "$subject" =~ ^perf(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[3]}"
            elif [[ "$subject" =~ ^refactor(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[4]}"
            elif [[ "$subject" =~ ^style(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[5]}"
            elif [[ "$subject" =~ ^test(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[6]}"
            elif [[ "$subject" =~ ^ci(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[7]}"
            elif [[ "$subject" =~ ^build(\([[:alnum:]_-]+\))?:[[:space:]].*$ ]]; then
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[8]}"
            else
              printf -- '- %s (%s)\n' "$subject" "$abbrev" >> "${group_files[9]}"
            fi
          done < <(git log --reverse --no-merges --pretty=format:'%s%x1f%h' "$LOG_RANGE")

          {
            echo "## $CURRENT_TAG 更新日志"
            echo "🎉 **正式版本发布完成！**"
            echo "### 📋 版本信息"
            echo "- 版本号: $CURRENT_TAG"
            echo "- 编译时间: $BUILD_TIME"
            echo "- 提交ID: $SHORT_SHA"
            echo
            echo "### $RANGE_TITLE"

            for index in "${!group_titles[@]}"; do
              file="${group_files[$index]}"
              if [ ! -s "$file" ]; then
                continue
              fi

              echo "#### ${group_titles[$index]}"
              cat "$file"
              echo
            done
          } > dist/changelog.md

      - name: Prepare APK artifact
        id: artifact
        shell: bash
        run: |
          SRC="frontend/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            SRC="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi

          if [ ! -f "$SRC" ]; then
            echo "Release APK not found"
            exit 1
          fi

          OUT_DIR="dist"
          mkdir -p "$OUT_DIR"
          OUT_FILE="latex-qapp-${{ steps.tag.outputs.value }}.apk"
          cp "$SRC" "$OUT_DIR/$OUT_FILE"
          echo "path=$OUT_DIR/$OUT_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body_path: dist/changelog.md
          files: ${{ steps.artifact.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
