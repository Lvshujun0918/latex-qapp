name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (example: v1.2.3)"
        required: true
        type: string

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $TAG"
            echo "Expected format: v1.2.3"
            exit 1
          fi

          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute Android build metadata
        id: meta
        shell: bash
        run: |
          VERSION_NAME="${{ steps.tag.outputs.value }}"
          VERSION_NAME="${VERSION_NAME#v}"
          BASE_VERSION="${VERSION_NAME%%[-+]*}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Invalid semver for versionCode calc: $VERSION_NAME"
            exit 1
          fi

          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.tag.outputs.value }}" "${{ github.sha }}"
          git push origin "refs/tags/${{ steps.tag.outputs.value }}" --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build release APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PVERSION_NAME=${{ steps.meta.outputs.version_name }} \
            -PVERSION_CODE=${{ steps.meta.outputs.version_code }} \
            -PGIT_SHA=${{ steps.meta.outputs.git_sha }} \
            -PBUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Prepare APK artifact
        id: artifact
        shell: bash
        run: |
          SRC="frontend/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            SRC="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi

          if [ ! -f "$SRC" ]; then
            echo "Release APK not found"
            exit 1
          fi

          OUT_DIR="dist"
          mkdir -p "$OUT_DIR"
          OUT_FILE="latex-qapp-${{ steps.tag.outputs.value }}.apk"
          cp "$SRC" "$OUT_DIR/$OUT_FILE"
          echo "path=$OUT_DIR/$OUT_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
